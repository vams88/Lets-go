
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Go — Admin Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f6f8;color:#171820}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .topbar{background:#171820;color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10}
    .brand{font-size:24px;font-weight:800}.sub{font-size:13px;color:#aeb2bf;margin-top:2px}
    .logout{border:1px solid #555968;background:transparent;color:#fff;border-radius:10px;padding:10px 14px}
    main{max-width:1050px;margin:0 auto;padding:22px}
    .card{background:#fff;border:1px solid #e2e4e9;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    h1,h2,h3{margin:0 0 14px}.muted{color:#6b707c}.hidden{display:none!important}
    label{display:block;font-weight:700;margin:14px 0 7px}
    input,textarea{width:100%;border:1px solid #cfd2d8;border-radius:12px;padding:13px;background:#fff}
    textarea{min-height:100px;resize:vertical}
    .primary{width:100%;border:0;background:#171820;color:#fff;border-radius:12px;padding:14px;font-weight:800;margin-top:18px}
    .secondary{border:1px solid #cfd2d8;background:#fff;border-radius:10px;padding:10px 14px}
    .danger{border:0;background:#b42318;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700}
    .success{border:0;background:#087443;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700}
    .notice{padding:13px 15px;border-radius:12px;margin:12px 0;background:#f0f1f4}
    .error{background:#fff0ef;color:#a52820}.ok{background:#ecfdf3;color:#087443}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .app-row{border:1px solid #e0e2e7;border-radius:14px;padding:16px;margin-top:12px}
    .row-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#fff3cd;font-size:12px;font-weight:800}
    .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-top:12px}
    .meta div{padding:8px 0;border-bottom:1px solid #eee}.meta b{display:block;font-size:12px;color:#727784;margin-bottom:2px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .admin-tabs{display:flex;gap:10px;padding:10px}
    .admin-tab{border:1px solid #cfd2d8;background:#fff;border-radius:10px;padding:11px 16px;font-weight:800}
    .admin-tab.active{background:#171820;color:#fff;border-color:#171820}
    select.secondary{cursor:pointer}
    .booking-card{border:1px solid #e0e2e7;border-radius:14px;padding:16px;margin-top:12px;background:#fff}
    .booking-status{font-weight:800}
    .status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;margin-top:12px}
    @media(max-width:650px){.status-grid{grid-template-columns:1fr}}
    .back{margin-bottom:15px}
    .doc{width:100%;max-height:520px;object-fit:contain;border:1px solid #ddd;border-radius:12px;background:#fafafa}
    .pdfbox{padding:18px;border:1px dashed #bbb;border-radius:12px}
    @media(max-width:650px){main{padding:14px}.card{padding:16px}.meta,.detail-grid{grid-template-columns:1fr}.topbar{padding:15px}.brand{font-size:21px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div><div class="brand">Let's Go — Admin</div><div class="sub">Administration Dashboard</div></div>
    <button id="logoutBtn" class="logout hidden">Log Out</button>
  </header>

  <main>
    <section id="loginView" class="card">
      <h1>Admin Login</h1>
      <p class="muted">Sign in with an account that has the <b>admin</b> role.</p>
      <div id="loginMessage"></div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn" class="primary">Log In</button>
    </section>

    <section id="dashboardView" class="hidden">
      <div class="toolbar card">
        <div><h1>Dashboard</h1><div class="muted">Let's Go administration</div></div>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>

      <div class="admin-tabs card">
        <button id="applicationsTab" class="admin-tab active">Applications</button>
        <button id="bookingsTab" class="admin-tab">Bookings</button>
      </div>

      <div id="dashboardMessage"></div>

      <div id="applicationsSection">
        <div id="applicationsList"></div>
      </div>

      <div id="bookingsSection" class="hidden">
        <div class="card">
          <div class="toolbar">
            <div>
              <h2>Bookings</h2>
              <div class="muted">All customer rides and their current assignment/payment status.</div>
            </div>
            <select id="bookingStatusFilter" class="secondary">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="accepted">Accepted</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div id="bookingsList"></div>
      </div>
    </section>

    <section id="detailView" class="hidden">
      <button id="backBtn" class="secondary back">← Back to Applications</button>
      <div class="card">
        <h2>Application Review</h2>
        <div id="detailMessage"></div>
        <div id="detailContent"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
